<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz cumpleaños Mi Yaquicita hermosa ✨❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #05020a; overflow: hidden; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .header-title { position: absolute; top: 4%; width: 100%; text-align: center; font-size: 2.2rem; font-weight: bold; color: #ff4d8d; text-shadow: 0 0 15px #ff4d8d; z-index: 10; pointer-events: none; }
    .footer-subtitle { position: absolute; bottom: 3%; width: 100%; text-align: center; font-size: 1.2rem; color: #ffd1dc; z-index: 10; pointer-events: none; }
    .instructions { position: absolute; bottom: 8%; width: 100%; text-align: center; font-size: 0.9rem; color: #aaa; z-index: 10; pointer-events: none; }
    
    /* Reproductor Neón Arrastrable y Estético */
    .music-player-container {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 5, 25, 0.65);
      border: 1.5px solid #ff4d8d;
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 15px rgba(255, 77, 141, 0.4), inset 0 0 10px rgba(255, 77, 141, 0.15);
      cursor: grab;
      touch-action: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .music-player-container:active {
      cursor: grabbing;
      box-shadow: 0 0 22px rgba(255, 77, 141, 0.7);
    }

    .play-btn {
      background: #ff4d8d;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px #ff4d8d;
      transition: transform 0.2s ease, background-color 0.3s;
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: #ff669d;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Barra de progreso personalizada Neón */
    #barra-progreso {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    #barra-progreso::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff4d8d;
      box-shadow: 0 0 8px #ff4d8d;
      cursor: pointer;
    }

    #barra-progreso::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #ff4d8d;
      box-shadow: 0 0 8px #ff4d8d;
      cursor: pointer;
      border: none;
    }

    #tiempo-actual {
      font-size: 0.85rem;
      color: #ffd1dc;
      font-weight: 600;
      min-width: 35px;
      text-shadow: 0 0 5px rgba(255, 209, 220, 0.5);
    }
  </style>
</head>
<body>

  <div class="header-title" id="titulo-web">¡Feliz Cumpleaños, Mi niña preciosa! 🫂🥳❤️</div>
  <div class="footer-subtitle" id="subtitulo-web">Te amo con todo mi corazón❤️✨</div>
  <div class="instructions">Usa el dedo para mover y ver todo...</div>
  
  <!-- Reproductor Estético Integrado -->
  <div class="music-player-container" id="player-drag">
    <button class="play-btn" id="btn-play">▶</button>
    <div class="player-controls">
      <input type="range" id="barra-progreso" value="0" min="0" max="100" step="0.1">
      <span id="tiempo-actual">0:00</span>
    </div>
  </div>

  <audio id="musica-fondo" loop src="canción1.mp3.mpeg"></audio>

  <div id="canvas-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Control de audio neón
    const btnPlay = document.getElementById('btn-play');
    const musica = document.getElementById('musica-fondo');
    const barraProgreso = document.getElementById('barra-progreso');
    const tiempoActual = document.getElementById('tiempo-actual');
    let reproduciendo = false;

    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!reproduciendo) {
        musica.play();
        btnPlay.innerHTML = "❚❚";
        reproduciendo = true;
      } else {
        musica.pause();
        btnPlay.innerHTML = "▶";
        reproduciendo = false;
      }
    });

    musica.addEventListener('timeupdate', () => {
      if (musica.duration) {
        const porcentaje = (musica.currentTime / musica.duration) * 100;
        barraProgreso.value = porcentaje;

        const mins = Math.floor(musica.currentTime / 60);
        const segs = Math.floor(musica.currentTime % 60);
        tiempoActual.innerText = `${mins}:${segs < 10 ? '0' : ''}${segs}`;
      }
    });

    barraProgreso.addEventListener('input', (e) => {
      e.stopPropagation();
      if (musica.duration) {
        const nuevoTiempo = (barraProgreso.value / 100) * musica.duration;
        musica.currentTime = nuevoTiempo;
      }
    });

    // Sistema de arrastre compatible con Celular y Laptop
    const dragItem = document.getElementById("player-drag");
    let active = false;
    let currentX = 0, currentY = 0, initialX = 0, initialY = 0;

    const dragStart = (e) => {
      if (e.target === btnPlay || e.target === barraProgreso) return;
      e.stopPropagation();

      if (e.type === "touchstart") {
        initialX = e.touches[0].clientX - currentX;
        initialY = e.touches[0].clientY - currentY;
      } else {
        initialX = e.clientX - currentX;
        initialY = e.clientY - currentY;
      }

      if (e.target === dragItem || dragItem.contains(e.target)) {
        active = true;
      }
    };

    const dragEnd = () => {
      active = false;
    };

    const drag = (e) => {
      if (active) {
        e.preventDefault();
        e.stopPropagation();

        if (e.type === "touchmove") {
          currentX = e.touches[0].clientX - initialX;
          currentY = e.touches[0].clientY - initialY;
        } else {
          currentX = e.clientX - initialX;
          currentY = e.clientY - initialY;
        }

        dragItem.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
      }
    };

    dragItem.addEventListener("touchstart", dragStart, { passive: false });
    document.addEventListener("touchend", dragEnd, false);
    document.addEventListener("touchmove", drag, { passive: false });

    dragItem.addEventListener("mousedown", dragStart, false);
    document.addEventListener("mouseup", dragEnd, false);
    document.addEventListener("mousemove", drag, false);

    window.addEventListener('load', () => {
      const phrases = [
        "Te Amodoro❤️❤️❤️", "Eres mi niña preciosa🥰", "Mi Persona Favorita🙂‍↔️", 
        "Nuestras vidas unidas por amor🥰❤️", "Feliz Cumpleaños mi niña✨❤️", 
        "Hoy es un día hermoso✨🙂‍↔️❤️", "Jaqueline 🥰❤️", "Mi nalgona preciosa🤭❤️", 
        "Te amooooo un monton🥰❤️", "Siempre Juntos🥰❤️", "Mi lugar favorito es a tu lado 🌌✨", 
        "Gracias por existir ❤️", "Haces mi mundo más bonito 🌎💖", "Mi reina hermosa 👑🥰", 
        "Tu sonrisa ilumina mi vida ✨😊", "Juntos por siempre ♾️❤️", 
        "Eres mi sueño hecho realidad 💫😍", "Amor de mi vida ❤️✨", "Cada día te amo más 🥰💖", 
        "Mi estrella más brillante 🌟❤️", "Eres mi felicidad 🥳💖", "Te elijo hoy y siempre 💌✨"
      ];

      const misFotos = [
        "foto1.jpg.jpeg", "foto2.jpg.jpeg", "foto3.jpg.jpeg", "foto4.jpg.jpeg", 
        "foto5.jpg.jpeg", "foto6.jpg.jpeg", "foto7.jpg.jpeg", "foto8.jpg.jpeg", "foto9.jpg.jpeg"
      ];

      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 24, 36);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;

      // 1. Estrellas
      const starsGeometry = new THREE.BufferGeometry();
      const starsCount = 3500;
      const starPositions = new Float32Array(starsCount * 3);
      for (let i = 0; i < starsCount * 3; i++) { starPositions[i] = (Math.random() - 0.5) * 220; }
      starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35 })));

      // 2. GALAXIA ESPIRAL
      const galaxyGeometry = new THREE.BufferGeometry();
      const galaxyCount = 8000;
      const galaxyCurrentPos = new Float32Array(galaxyCount * 3);
      const galaxyTargetPos = new Float32Array(galaxyCount * 3);
      const galaxyCols = new Float32Array(galaxyCount * 3);
      const arms = 3, radius = 28;

      for (let i = 0; i < galaxyCount; i++) {
        const r = Math.pow(Math.random(), 2) * radius;
        const spinAngle = r * 0.8;
        const branchAngle = ((i % arms) * 2 * Math.PI) / arms;

        const destX = Math.cos(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 1.2;
        const destY = (Math.random() - 0.5) * 0.6 - 2;
        const destZ = Math.sin(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 1.2;

        galaxyTargetPos[i*3] = destX;
        galaxyTargetPos[i*3+1] = destY;
        galaxyTargetPos[i*3+2] = destZ;

        galaxyCurrentPos[i*3] = 0;
        galaxyCurrentPos[i*3+1] = 0;
        galaxyCurrentPos[i*3+2] = 0;

        const color = new THREE.Color();
        if (r < radius * 0.3) color.setHex(0xffffff);
        else if (r < radius * 0.7) color.setHex(0xff0088);
        else color.setHex(0x8800ff);

        galaxyCols[i*3] = color.r; galaxyCols[i*3+1] = color.g; galaxyCols[i*3+2] = color.b;
      }

      galaxyGeometry.setAttribute('position', new THREE.BufferAttribute(galaxyCurrentPos, 3));
      galaxyGeometry.setAttribute('color', new THREE.BufferAttribute(galaxyCols, 3));
      const galaxyMesh = new THREE.Points(galaxyGeometry, new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
      scene.add(galaxyMesh);

      // 3. CORAZÓN
      const heartGeometry = new THREE.BufferGeometry();
      const heartParticles = 2500;
      const heartCurrentPos = new Float32Array(heartParticles * 3);
      const heartTargetPos = new Float32Array(heartParticles * 3);

      for (let i = 0; i < heartParticles; i++) {
        let t = Math.PI * (Math.random() * 2 - 1);
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        
        heartTargetPos[i*3] = x * 0.45; 
        heartTargetPos[i*3+1] = y * 0.45; 
        heartTargetPos[i*3+2] = (Math.random() - 0.5) * 2.5;

        heartCurrentPos[i*3] = 0;
        heartCurrentPos[i*3+1] = 0;
        heartCurrentPos[i*3+2] = 0;
      }

      heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartCurrentPos, 3));
      const heartMesh = new THREE.Points(heartGeometry, new THREE.PointsMaterial({ color: 0xff0055, size: 0.35, transparent: true, opacity: 0.95 }));
      scene.add(heartMesh);

      // 4. FOTOS Y FRASES
      const orbitGroup = new THREE.Group();
      orbitGroup.rotation.x = Math.PI * 0.15;
      orbitGroup.scale.set(0.001, 0.001, 0.001);
      scene.add(orbitGroup);

      const coloresTexto = ["#ff80bf", "#ffffff", "#ffcc00", "#00ffff"];
      function createTextTexture(text, colorIndex) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024; canvas.height = 256;
        ctx.font = "Bold 65px 'Segoe UI', sans-serif"; 
        ctx.fillStyle = coloresTexto[colorIndex % coloresTexto.length]; 
        ctx.textAlign = "center";
        ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 12;
        ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 10);
        return new THREE.CanvasTexture(canvas);
      }

      phrases.forEach((phrase, index) => {
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: createTextTexture(phrase, index), transparent: true }));
        const currentRadius = (index % 2 === 0) ? 23 : 31;
        const angle = (index / phrases.length) * Math.PI * 2;
        sprite.position.set(Math.cos(angle) * currentRadius, (Math.random() - 0.5) * 10, Math.sin(angle) * currentRadius);
        sprite.scale.set(10, 2.5, 1);
        orbitGroup.add(sprite);
      });

      const loader = new THREE.TextureLoader();
      misFotos.forEach((foto, index) => {
        loader.load(foto, (tex) => {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
          const angle = (index / misFotos.length) * Math.PI * 2 + 0.5;
          sprite.position.set(Math.cos(angle) * 16, (Math.random() - 0.5) * 4, Math.sin(angle) * 16);
          sprite.scale.set(7, 7, 1);
          orbitGroup.add(sprite);
        }, undefined, () => {});
      });

      // BIG BANG
      let bangProgress = 0;

      function animate() {
        requestAnimationFrame(animate);

        if (bangProgress < 1) {
          bangProgress += 0.008;

          const gPositions = galaxyGeometry.attributes.position.array;
          for (let i = 0; i < galaxyCount * 3; i++) {
            gPositions[i] = THREE.MathUtils.lerp(0, galaxyTargetPos[i], bangProgress);
          }
          galaxyGeometry.attributes.position.needsUpdate = true;

          const hPositions = heartGeometry.attributes.position.array;
          for (let i = 0; i < heartParticles * 3; i++) {
            hPositions[i] = THREE.MathUtils.lerp(0, heartTargetPos[i], bangProgress);
          }
          heartGeometry.attributes.position.needsUpdate = true;

          orbitGroup.scale.setScalar(bangProgress);
        }

        heartMesh.rotation.y += 0.002;
        orbitGroup.rotation.y += 0.0012;
        galaxyMesh.rotation.y += 0.0015;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    });
  </script>
</body>
</html>
