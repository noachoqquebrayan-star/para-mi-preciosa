<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Mi Yaquicita ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #05020a; overflow: hidden; color: #fff; font-family: 'Segoe UI', sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    .header-title { position: absolute; top: 6%; width: 100%; text-align: center; font-size: 2.2rem; font-weight: bold; color: #ff4d8d; text-shadow: 0 0 15px #ff4d8d; z-index: 10; pointer-events: none; }
    .footer-subtitle { position: absolute; bottom: 5%; width: 100%; text-align: center; font-size: 1.2rem; color: #ffd1dc; z-index: 10; pointer-events: none; }
    .instructions { position: absolute; bottom: 12%; width: 100%; text-align: center; font-size: 0.9rem; color: #aaa; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>

  <div class="header-title" id="titulo-web">Feliz Cumpleaños, Mi niña preciosa! 🫂🥳❤️</div>
  <div class="footer-subtitle" id="subtitulo-web">Te amo con todo mi corazón❤️✨</div>
  <div class="instructions">Usa el dedo para mover y ver todo...</div>
  <div id="canvas-container"></div>

  <!-- Librería Three.js y Controles -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Este script ESENCIAL añade los controles táctiles y de ratón -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ============================================================
    // ⚙️ SECCIÓN DE CONFIGURACIÓN (TUS TEXTOS Y FOTOS)
    // ============================================================
    const TITULO_SUPERIOR = "¡Feliz Cumpleaños, Mi niña preciosa! 🫂🥳❤️";
    const SUBTITULO_INFERIOR = "Te amo con todo mi corazón❤️✨";

    const frasesDeAmor = [
      "Te Amodoro❤️❤️❤️", "Eres mi niña preciosa🥰", "Mi Persona Favorita🙂‍↔️", "Nuestras vidas unidas por nuestro amor🥰❤️",
      "Feliz Cumpleaños mi niña✨❤️", "Espero que hoy sea un día hermoso para ti mi niña✨🙂‍↔️❤️", "Jaqueline 🥰❤️", "Mi nalgona preciosa🤭❤️", "Te amooooo un monton🥰❤️", "Siempre Juntos contra todo🥰❤️"
    ];

    // Asegúrate de que las fotos que subiste a GitHub tengan ESTOS nombres exactos.
    const misFotos = [
      "foto1.jpg.jpeg", "foto2.jpg.jpeg", "foto3.jpg.jpeg", "foto4.jpg.jpeg"
    ];

    // ============================================================
    // 🚀 LÓGICA DE LA GALAXIA INTERACTIVA (3D)
    // ============================================================
    document.getElementById('titulo-web').innerText = TITULO_SUPERIOR;
    document.getElementById('subtitulo-web').innerText = SUBTITULO_INFERIOR;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 40; // Un poco más lejos para tener espacio para interactuar

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // --- NUEVO: AÑADIR CONTROLES INTERACTIVOS ---
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Hace el movimiento suave
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;
    controls.minDistance = 10; // Zoom máximo
    controls.maxDistance = 100; // Zoom mínimo
    controls.enablePan = false; // Desactiva el desplazamiento lateral para mantener el corazón centrado

    // 1. Estrellas de fondo
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starPositions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i++) { starPositions[i] = (Math.random() - 0.5) * 200; }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3 });
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(starField);

    // 2. Corazón Central de Partículas
    const heartGeometry = new THREE.BufferGeometry();
    const heartParticles = 2000;
    const heartPositions = new Float32Array(heartParticles * 3);
    for (let i = 0; i < heartParticles; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = (Math.random() - 0.5) * 4;
      heartPositions[i*3] = x * 0.45; heartPositions[i*3+1] = y * 0.45; heartPositions[i*3+2] = z * 0.45;
    }
    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    const heartMaterial = new THREE.PointsMaterial({ color: 0xff0055, size: 0.3, transparent: true, opacity: 0.95 });
    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    scene.add(heartMesh);

    const orbitGroup = new THREE.Group();
    scene.add(orbitGroup);

    // 3. Crear Frases Flotantes (sprites)
    function createTextTexture(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 128;
      ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "Bold 36px 'Segoe UI', sans-serif"; ctx.fillStyle = "#ff80bf"; ctx.textAlign = "center";
      ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 12; ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 10);
      return new THREE.CanvasTexture(canvas);
    }

    const radius = 22;
    frasesDeAmor.forEach((phrase, index) => {
      const texture = createTextTexture(phrase);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(spriteMaterial);
      const angle = (index / frasesDeAmor.length) * Math.PI * 2;
      sprite.position.x = Math.cos(angle) * radius; sprite.position.z = Math.sin(angle) * radius; sprite.position.y = (Math.random() - 0.5) * 10;
      sprite.scale.set(10, 2.5, 1);
      orbitGroup.add(sprite);
    });

    // 4. Cargar Fotos en Órbita
    const textureLoader = new THREE.TextureLoader();
    misFotos.forEach((fotoUrl, index) => {
      textureLoader.load(fotoUrl, (texture) => {
          const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
          const sprite = new THREE.Sprite(material);
          const angle = (index / misFotos.length) * Math.PI * 2 + 0.8; // Un desfase
          const photoRadius = 16;
          sprite.position.x = Math.cos(angle) * photoRadius; sprite.position.z = Math.sin(angle) * photoRadius; sprite.position.y = (Math.random() - 0.5) * 6;
          sprite.scale.set(6, 6, 1); // Fotos un poco más grandes para que sean visibles al alejar
          orbitGroup.add(sprite);
        });
    });

    // Bucle de Animación
    function animate() {
      requestAnimationFrame(animate);
      
      // Rotación automática suave (sigue girando sola si no tocas)
      heartMesh.rotation.y += 0.002;
      orbitGroup.rotation.y += 0.001;
      starField.rotation.y -= 0.0002;

      // --- NUEVO: ACTUALIZAR LOS CONTROLES EN CADA FRAME ---
      controls.update(); 

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
